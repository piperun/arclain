[workspace]
members = [
    "crates/core",
    "crates/ui",
    "crates/db",
    "crates/plugins",
    "crates/checksum",
    "crates/db_derive",
    "crates/widgets",
    "crates/theme",
    "crates/http",
    "crates/data"
, "crates/data"]
exclude = [
    "plugins/dlsite-metadata",
    "plugins/gstreamer-preview",
    "plugins/ui-demo",
    "plugin-sdk"
]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[workspace]
members = [
    "crates/core",
    "crates/ui",
    "crates/db",
    "crates/plugins",
    "crates/checksum",
    "crates/widgets",
    "crates/theme",
    "crates/network",
    "crates/data",
    "crates/signals",
    # Shared ORM
    "crates/mini-orm",
    "crates/mini-orm/derive",
    "crates/freya-spike",
]
default-members = ["crates/ui"]
exclude = [
    "plugins/dlsite-metadata",
    "plugins/gstreamer-preview",
    "plugins/ui-demo",
    "plugin-sdk",
    "crates/dioxus-spike",
    "crates/iced-spike",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
chrono = "0.4"
dirs = "6"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tracing = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

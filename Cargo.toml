[workspace]
members = [
    "crates/core",
    "crates/ui",
    "crates/db",
    "crates/plugins",
    "crates/checksum",
    "crates/db_derive",
    "crates/widgets",
    "crates/theme",
    "crates/http",
    "crates/data",
    # Shared ORM
    "crates/mini-orm",
    "crates/mini-orm/derive",
    # Metastore sub-crates
    "crates/metastore/types",
    "crates/metastore/abstract",
    "crates/metastore/providers",
    "crates/metastore/database",
    "crates/metastore/ui",
]
exclude = [
    "plugins/dlsite-metadata",
    "plugins/gstreamer-preview",
    "plugins/ui-demo",
    "plugin-sdk"
]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

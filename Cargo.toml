[workspace]
members = [
    "crates/core",
    "crates/ui",
    "crates/db",
    "crates/plugins",
    "crates/checksum",
    "crates/widgets",
    "crates/theme",
    "crates/network",
    "crates/data",
    "crates/signals",
    # Shared ORM
    "crates/mini-orm",
    "crates/mini-orm/derive",
    # Metastore sub-crates
    "crates/metastore/types",
    "crates/metastore/abstract",
    "crates/metastore/providers",
    "crates/metastore/database",
    "crates/metastore/ui",
    # Gameta - pure parser library + server/client
    "crates/gameta_lib",
    "crates/gameta",
    "crates/freya-spike",
    "crates/dlsite-fetch",
]
default-members = ["crates/ui"]
exclude = [
    "plugins/dlsite-metadata",
    "plugins/gstreamer-preview",
    "plugins/ui-demo",
    "plugin-sdk",
    "crates/dioxus-spike",
    "crates/iced-spike",
]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

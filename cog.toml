from_latest_tag = true
ignore_merge_commits = true
branch_whitelist = ["master", "main"]
generate_mono_repository_global_tag = false
generate_mono_repository_package_tags = true

pre_bump_hooks = [
    "cargo check --workspace",
]
post_bump_hooks = [
    "cargo check --workspace",
]

[commit_types]
feature = { changelog_title = "Features" }

[changelog]
path = "CHANGELOG.md"
authors = []

# Named hook profile for full release validation
[bump_profiles.release]
pre_bump_hooks = [
    "cargo test --workspace",
    "cargo check --workspace",
]
post_bump_hooks = [
    "cargo check --workspace",
]

# ─── VERSIONING RULES ────────────────────────────────────────────────────────
# Use: cog bump --auto
#
# This bumps all packages that have relevant commits since their last tag.
# Scoped commits route to the right package:
#   feat(ui): ...   fix(core): ...   refactor(db): ...
#
# arclain_ui is the main deliverable (public_api = true).
# All other workspace crates are internal.
#
# Plugins (dlsite-metadata, etc.) are versioned independently since they
# build as WASM and ship separately.
# ─────────────────────────────────────────────────────────────────────────────

[monorepo.packages.arclain_ui]
path = "crates/ui"
public_api = true
changelog_path = "crates/ui/CHANGELOG.md"
pre_bump_hooks = [
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' Cargo.toml",
]
post_bump_hooks = []

[monorepo.packages.arclain_core]
path = "crates/core"
public_api = false
changelog_path = "crates/core/CHANGELOG.md"
pre_bump_hooks = [
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' Cargo.toml",

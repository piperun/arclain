[changelog]
path = "CHANGELOG.md"
authors = []

# ─── VERSIONING RULES ────────────────────────────────────────────────────────
# Use: cog bump --auto
#
# This bumps all packages that have relevant commits since their last tag.
# Scoped commits route to the right package:
#   feat(ui): ...   fix(core): ...   refactor(db): ...
#
# The UI package is the main deliverable (public_api = true).
# All other workspace crates are internal.
#
# Plugins (dlsite-metadata, etc.) are versioned independently since they
# build as WASM and ship separately.
# ─────────────────────────────────────────────────────────────────────────────

[packages.arclain_ui]
path = "crates/ui"
public_api = true
changelog_path = "crates/ui/CHANGELOG.md"
pre_bump_hooks = [
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' Cargo.toml",
]
post_bump_hooks = []

[packages.arclain_core]
path = "crates/core"
public_api = false
changelog_path = "crates/core/CHANGELOG.md"
pre_bump_hooks = [

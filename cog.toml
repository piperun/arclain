from_latest_tag = true
ignore_merge_commits = true
branch_whitelist = ["master", "main"]

# v2 versioning model: the 10 arclain workspace crates share a single
# unified version published as the global tag `v{version}`. Per-package
# tags stay enabled only so `dlsite-metadata` (excluded from the
# workspace) can still bump independently — it ships as WASM out-of-band
# from the desktop app.
generate_mono_repository_global_tag = true
generate_mono_repository_package_tags = true

# Root-level pre/post hooks run on the global workspace bump. The sed
# fan-out keeps every arclain crate's Cargo.toml version aligned with
# the workspace version, then cargo check refreshes Cargo.lock.
pre_bump_hooks = [
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' crates/core/Cargo.toml",
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' crates/db/Cargo.toml",
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' crates/data/Cargo.toml",
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' crates/plugins/Cargo.toml",
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' crates/ui/Cargo.toml",
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' crates/checksum/Cargo.toml",
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' crates/widgets/Cargo.toml",
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' crates/theme/Cargo.toml",
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' crates/network/Cargo.toml",
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' crates/signals/Cargo.toml",
    "cargo check --workspace",
]
post_bump_hooks = [
    "cargo check --workspace",
]

[commit_types]
feature = { changelog_title = "Features" }

[changelog]
path = "CHANGELOG.md"
authors = []

# Named hook profile for full release validation
[bump_profiles.release]
pre_bump_hooks = [
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' crates/core/Cargo.toml",
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' crates/db/Cargo.toml",
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' crates/data/Cargo.toml",
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' crates/plugins/Cargo.toml",
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' crates/ui/Cargo.toml",
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' crates/checksum/Cargo.toml",
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' crates/widgets/Cargo.toml",
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' crates/theme/Cargo.toml",
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' crates/network/Cargo.toml",
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' crates/signals/Cargo.toml",
    "cargo test --workspace",
    "cargo check --workspace",
]
post_bump_hooks = [
    "cargo check --workspace",
]

# ─── VERSIONING RULES (post-v2) ───────────────────────────────────────────────
# Use: cog bump --auto
#
# The 10 arclain workspace crates bump together as a single unified version
# (tag format: `v{version}`). Any feat/fix/refactor commit on the workspace
# drives the next bump.
#
# Plugins (dlsite-metadata, etc.) stay versioned independently because they
# build as WASM and ship out-of-band from the desktop app. Bump those via
# `cog bump --package dlsite-metadata` explicitly.
# ─────────────────────────────────────────────────────────────────────────────

[monorepo.packages.dlsite-metadata]
path = "plugins/dlsite-metadata"
public_api = false
changelog_path = "plugins/dlsite-metadata/CHANGELOG.md"
pre_bump_hooks = [
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' Cargo.toml",
]
post_bump_hooks = []

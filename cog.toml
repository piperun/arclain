from_latest_tag = true
ignore_merge_commits = true
branch_whitelist = ["master", "main"]

# v2 versioning model: the 10 arclain workspace crates share a single
# unified version published as the global tag. Per-package tags stay enabled
# only so `dlsite-metadata` (excluded from the workspace) can bump its
# manifest/changelog independently. Release CI ignores those package tags;
# plugin WASM ships bundled with the desktop app until the plugin ABI has an
# explicit compatibility guard.
generate_mono_repository_global_tag = true
generate_mono_repository_package_tags = true

# Root-level pre/post hooks run on the global workspace bump. All 10
# crates now inherit `version` from `[workspace.package]` in the root
# Cargo.toml, so a single sed targeting that section bumps every
# crate at once. The address range `/^\[workspace\.package\]/,/^\[/`
# scopes the replace between the section header and the next
# `[section]`, so it can't accidentally rewrite a dependency-section
# `version = ...` line.
pre_bump_hooks = [
    "sed -i '/^\\[workspace\\.package\\]/,/^\\[/ s/^version = \".*\"/version = \"{{version}}\"/' Cargo.toml",
    "cargo check --workspace",
]
post_bump_hooks = [
    "cargo check --workspace",
]

[commit_types]
feature = { changelog_title = "Features" }

[changelog]
path = "CHANGELOG.md"
authors = []

# Named hook profile for full release validation
[bump_profiles.release]
pre_bump_hooks = [
    "sed -i '/^\\[workspace\\.package\\]/,/^\\[/ s/^version = \".*\"/version = \"{{version}}\"/' Cargo.toml",
    "cargo test --workspace",
    "cargo check --workspace",
]
post_bump_hooks = [
    "cargo check --workspace",
]

# ─── VERSIONING RULES (post-v2) ───────────────────────────────────────────────
# Use: cog bump --auto
#
# The 10 arclain workspace crates bump together as a single unified version
# (tag format: `{version}`). Any feat/fix/refactor commit on the workspace
# drives the next bump.
#
# Plugins (dlsite-metadata, etc.) can still be versioned independently for
# manifest/changelog bookkeeping via `cog bump --package dlsite-metadata`,
# but package tags do not publish standalone plugin artifacts. App releases
# bundle the current plugin WASM beside the desktop binary.
# ─────────────────────────────────────────────────────────────────────────────

[monorepo.packages.dlsite-metadata]
path = "plugins/dlsite-metadata"
public_api = false
changelog_path = "plugins/dlsite-metadata/CHANGELOG.md"
# Both manifests carry the version, and the loader reads plugin.toml
# while cargo reads Cargo.toml. Bumping only one leaves the built
# artifact named for a version its own crate disagrees with, which
# `test_plugin_manifest_versions_match_cargo` refuses. `version` is the
# only key spelled that way in plugin.toml -- the ABI line is `abi` --
# so anchoring at the start of the line hits exactly one of them.
pre_bump_hooks = [
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' Cargo.toml",
    "sed -i 's/^version = \".*\"/version = \"{{version}}\"/' plugin.toml",
]
post_bump_hooks = []

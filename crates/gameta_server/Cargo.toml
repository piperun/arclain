[package]
name = "gameta_server"
version = "0.1.0"
edition = "2021"
description = "Optional metadata server daemon - REST API, background fetching, cache management"

[dependencies]
gameta_core = { path = "../gameta_core" }
gameta_lib = { path = "../gameta_lib" }
gameta_database = { path = "../gameta_database", default-features = false, features = ["async"] }

# Content-addressable cache
cacache = "13"

# HTTP server
axum = "0.8"
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# OpenAPI documentation
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "2"

# Backup/archive support
tar = "0.4"
flate2 = "1.0"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

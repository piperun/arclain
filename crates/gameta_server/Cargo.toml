[package]
name = "gameta_server"
version = "0.1.0"
edition = "2021"
description = "Optional metadata server daemon - REST API, background fetching, cache management"

[dependencies]
gameta_core = { path = "../gameta_core" }
gameta_lib = { path = "../gameta_lib" }

# HTTP server
axum = "0.8"
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "2"

[package]
name = "mini-orm"
version = "0.1.0"
edition = "2021"
description = "Minimal SQLite ORM with derive macro - shared between arclain and metastore"

[dependencies]
anyhow.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }

# Re-export the derive macro
mini-orm-derive = { path = "derive" }

[features]
default = []

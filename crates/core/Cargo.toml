[package]
name = "arclain_core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
thiserror = "2.0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
which = "8.0.0"
dirs = "6.0.0"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
fs_extra = "1"
crc32fast = "1"
toml = "0.8"
arclain_db = { path = "../db" }
reqwest = { version = "0.12.24", features = ["blocking", "json"] }

[dev-dependencies]
tempfile = "3"
rand = "0.8"
walkdir = "2.5.0"

[package]
name = "arclain_core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
which = "8.0.0"
dirs.workspace = true
once_cell = "1"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "local-time"] }
diesel.workspace = true
tracing-appender = "0.2"
chrono.workspace = true
fs_extra = "1"
crc32fast = "1"

zeroize.workspace = true
sha2.workspace = true
blake3 = "1.8"
arclain_db = { path = "../db", default-features = false }
arclain_data = { path = "../data", default-features = false }
arclain_checksum = { path = "../checksum" }
arclain-network = { path = "../network" }
arclain_app_fs = { path = "../app_fs" }

# External gameta dependencies (https://codeberg.org/0xdev/gameta)
gameta_core = { path = "../../../../codeberg/gameta/gameta_core", version = "=0.5.0", optional = true }
gameta_lib = { path = "../../../../codeberg/gameta/gameta_lib", version = "=0.5.0", features = ["dlsite"], optional = true }
gameta_database = { path = "../../../../codeberg/gameta/gameta_database", version = "=0.5.0", optional = true }
# Match arclain-network's TLS stack (rustls only) so the binary doesn't
# pull in two TLS implementations side-by-side (audit: TLS stack split).
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls", "gzip"] }
unrar = "0.5"
zip = "7.0.0"
tempfile.workspace = true
sevenz-rust2 = { version = "0.19.4", features = ["compress", "aes256"] }
parking_lot.workspace = true
rayon = "1.11.0"
tokio = { workspace = true, features = ["rt", "sync", "fs"] }
walkdir = "2.5.0"

[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple", target_os = "redox"))'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[features]
integration-tests = []
default = ["gameta"]
# The gameta metadata stack: LibraryService (diesel-backed store),
# DLSite filename detection, and the type re-exports. Off: archive,
# password-rule (regex tiers), organize and pipeline features all work;
# metadata lookups resolve to nothing.
gameta = [
    "dep:gameta_core",
    "dep:gameta_lib",
    "dep:gameta_database",
    "arclain_db/gameta",
    "arclain_data/gameta",
]

[[test]]
name = "dlsite_pipeline"
required-features = ["gameta"]

[dev-dependencies]
tempfile.workspace = true
rand.workspace = true
# Builds a content-encrypted ZIP fixture in-process for
# `tests/encrypted_zip_extraction.rs`, so the no-7-Zip configuration it
# exercises needs no 7-Zip to set itself up either. Same crate, version
# and features this package already depends on normally, so it adds
# nothing to the dependency tree.
zip = "7.0.0"
# Real IANA zones for `backends::entry_time`'s DST-edge tests: the
# ambiguous/nonexistent wall-clock branches cannot be exercised through
# `chrono::Local` zone-stably (a UTC machine has no DST edges), so the
# tests drive the zone-generic resolver with a fixed zone instead.
chrono-tz = "0.10"

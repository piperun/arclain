[package]
name = "arclain_core"
version = "0.6.4"
edition = "2021"

[dependencies]
anyhow = "1"
thiserror = "2.0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
which = "8.0.0"
dirs = "6.0.0"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
chrono = "0.4"
fs_extra = "1"
crc32fast = "1"

zeroize = "1.8.1"
base64 = "0.22"
sha2 = "0.10"
arclain_db = { path = "../db" }
arclain_checksum = { path = "../checksum" }
reqwest = { version = "0.12.24", features = ["blocking", "json"] }
unrar = "0.5"
zip = "2"
tempfile = "3"
sevenz-rust2 = { version = "0.19.4", features = ["compress", "aes256"] }
cacache = "13"
ssri = "9"
parking_lot = "0.12"
rayon = "1.11.0"

[dev-dependencies]
tempfile = "3"
rand = "0.9.2"
walkdir = "2.5.0"

[package]
name = "arclain_core"
version = "2.0.0"
edition = "2021"

[dependencies]
anyhow.workspace = true
thiserror = "2.0.17"
serde.workspace = true
serde_json.workspace = true
regex = "1"
which = "8.0.0"
dirs.workspace = true
once_cell = "1"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "local-time"] }
diesel = { version = "2.2", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "r2d2", "64-column-tables"] }
tracing-appender = "0.2"
chrono.workspace = true
fs_extra = "1"
crc32fast = "1"

zeroize = "1.8.1"
base64 = "0.22"
sha2 = "0.10"
blake3 = "1.8"
arclain_db = { path = "../db" }
arclain_data = { path = "../data" }
arclain_checksum = { path = "../checksum" }
arclain-network = { path = "../network" }

# External gameta dependencies (https://codeberg.org/0xdev/gameta)
gameta_core = { path = "../../../../codeberg/gameta/gameta_core" }
gameta_lib = { path = "../../../../codeberg/gameta/gameta_lib", features = ["dlsite"] }
gameta_database = { path = "../../../../codeberg/gameta/gameta_database" }
# Match arclain-network's TLS stack (rustls only) so the binary doesn't
# pull in two TLS implementations side-by-side (audit: TLS stack split).
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
unrar = "0.5"
zip = "7.0.0"
tempfile.workspace = true
sevenz-rust2 = { version = "0.19.4", features = ["compress", "aes256"] }
parking_lot.workspace = true
rayon = "1.11.0"
tokio = { version = "1", features = ["rt", "sync", "fs"] }
walkdir = "2.5.0"

[features]
integration-tests = []

[dev-dependencies]
tempfile.workspace = true
rand = "0.9.2"

[package]
name = "dlsite-fetch"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dlsite-fetch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["blocking", "rustls-tls", "socks", "gzip", "brotli", "deflate"] }
arclain-http = { path = "../../crates/http" }
arclain_db = { path = "../../crates/db" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "net", "time"] }
parking_lot = "0.12"

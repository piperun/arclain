[package]
name = "gameta_lib"
version = "0.1.0"
edition = "2021"
description = "Pure game metadata parsing library - no I/O"

[features]
default = ["dlsite"]
dlsite = []
steam = []
itchio = []

[dependencies]
gameta_core = { path = "../gameta_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scraper = "0.22"
regex = "1.10"
urlencoding = "2.1"
tracing = "0.1"
bitflags = "2.4"

[package]
name = "arclain_checksum"
version = "0.1.1"
edition = "2021"
description = "File integrity verification with Merkle trees and parallel hashing"

[dependencies]
# Hashing algorithms
crc32fast = "1.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha2 = "0.10"

# Parallelism
rayon = "1.10"

# Memory-mapped I/O for large files
memmap2 = "0.9"

# Directory walking
walkdir = "2.5"

# Error handling
anyhow.workspace = true

# Logging
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package]
name = "arclain-network"
version = "0.2.1"
edition = "2021"
description = "Secure async network client with domain security and rate limiting"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "gzip", "deflate", "brotli", "json", "blocking"] }
urlencoding = "2"

# URL parsing
url = "2"

# Unicode handling for homograph detection
unicode-normalization = "0.1"
unicode-script = "0.5"

# Concurrency primitives
parking_lot.workspace = true

# Logging
tracing.workspace = true

# Error handling
thiserror = "1"
anyhow.workspace = true

# Serialization (for whitelist entries and API responses)
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"

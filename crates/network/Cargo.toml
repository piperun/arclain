[package]
name = "arclain-network"
version = "0.1.0"
edition = "2021"
description = "Secure async network client with domain security and rate limiting"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "gzip", "deflate", "brotli", "json"] }

# URL parsing
url = "2"

# Unicode handling for homograph detection
unicode-normalization = "0.1"
unicode-script = "0.5"

# Concurrency primitives
parking_lot = "0.12"

# Logging
tracing = "0.1"

# Error handling
thiserror = "1"
anyhow = "1.0"

# Serialization (for whitelist entries and API responses)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"

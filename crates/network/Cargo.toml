[package]
name = "arclain-network"
version.workspace = true
edition.workspace = true
description = "Secure async network client with domain security and rate limiting"

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }

# HTTP client
reqwest = { workspace = true, features = ["rustls-tls", "socks", "gzip", "deflate", "brotli", "json", "blocking"] }
porxi = { git = "https://codeberg.org/0xdev/crateyard.git", rev = "e79e4e8a3ca8616c4989f0a49c7acad8c3332105", default-features = false }
urlencoding = "2"

# URL parsing
url = "2"

# Unicode handling for homograph detection
unicode-normalization = "0.1"
unicode-script = "0.5"

# Concurrency primitives
parking_lot.workspace = true

# Logging
tracing.workspace = true
sha2.workspace = true

# Error handling
thiserror.workspace = true

# Serialization (for whitelist entries and API responses)
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"

[package]
name = "arclain_plugins"
version.workspace = true
edition.workspace = true

[dependencies]
arclain_core = { path = "../core", default-features = false }
arclain_db = { path = "../db", default-features = false }
arclain_data = { path = "../data", default-features = false }
wasmtime = { version = "=47.0.1", features = ["component-model", "cache"] }
wasmtime-wasi = "=47.0.1"
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
toml = "0.9.8"
parking_lot.workspace = true
dirs.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
rfd = "0.16.0"
tempfile.workspace = true
arclain-network = { path = "../network" }
chrono.workspace = true
cap-std = "=4.0.2"
cap-fs-ext = "=4.0.2"
# External gameta dependency (https://codeberg.org/0xdev/gameta)
gameta_lib = { path = "../../../../codeberg/gameta/gameta_lib", version = "=0.5.0", features = ["dlsite"], optional = true }

[features]
default = ["gameta"]
# The metadata host-function engine (LibraryService-backed store access
# and the host-side DLSite HTML parser). The WIT surface is identical
# with it off: every metadata host fn stays registered and answers with
# an absent shape. That matches a service-less runtime on the
# service-backed read paths; emit, count validation ordering and the
# fallback tiers differ -- see host_functions::metadata_absent.
gameta = [
    "dep:gameta_lib",
    "arclain_core/gameta",
    "arclain_db/gameta",
    "arclain_data/gameta",
]

[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple", target_os = "redox"))'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
tracing-test = "0.2"

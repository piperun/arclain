[package]
name = "arclain_plugins"
version = "0.9.7"
edition = "2021"

[dependencies]
arclain_core = { path = "../core" }
arclain_db = { path = "../db" }
arclain_data = { path = "../data" }
wasmtime = { version = "26.0.0", features = ["component-model", "cache"] }
wasmtime-wasi = "26.0.0"
anyhow = "1"
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
toml = "0.9.8"
parking_lot = "0.12"
dirs = "6.0.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1", features = ["rt", "sync"] }
rfd = "0.16.0"
arclain-network = { path = "../network" }
arclain_signals = { path = "../signals" }
chrono = "0.4"
# External gameta dependency (https://codeberg.org/0xdev/gameta)
gameta_lib = { path = "../../../../codeberg/gameta/gameta_lib", features = ["dlsite"] }

[dev-dependencies]
tempfile = "3"
mockito = "1.5"

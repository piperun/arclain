[package]
name = "arclain_plugins"
version.workspace = true
edition.workspace = true

[dependencies]
arclain_core = { path = "../core" }
arclain_db = { path = "../db" }
arclain_data = { path = "../data" }
wasmtime = { version = "26.0.0", features = ["component-model", "cache"] }
wasmtime-wasi = "26.0.0"
anyhow.workspace = true
thiserror = "2.0"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
toml = "0.9.8"
parking_lot.workspace = true
dirs.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
rfd = "0.16.0"
open = "5"
arclain-network = { path = "../network" }
arclain_signals = { path = "../signals" }
chrono.workspace = true
# External gameta dependency (https://codeberg.org/0xdev/gameta)
gameta_lib = { path = "../../../../codeberg/gameta/gameta_lib", features = ["dlsite"] }

[dev-dependencies]
tempfile.workspace = true
tracing-test = "0.2"

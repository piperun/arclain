[package]
name = "arclain_db"
version = "0.1.0"
edition = "2021"

[lib]
name = "arclain_db"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
redb = "2.1"
aes-gcm = "0.10"
zeroize = "1.7"
base64 = "0.22"
dirs = "5"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
rand = "0.8"
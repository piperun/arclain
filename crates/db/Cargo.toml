[package]
name = "arclain_db"
version = "0.3.2"
edition = "2021"

[lib]
name = "arclain_db"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
redb = "2.1"
aes-gcm = "0.10"
zeroize = "1.7"
base64 = "0.22"
dirs = "5"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
cacache = "13"
mini-orm = { path = "../mini-orm" }
tracing = "0.1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
rand = "0.8"

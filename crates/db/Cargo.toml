[package]
name = "arclain_db"
version.workspace = true
edition.workspace = true

[lib]
name = "arclain_db"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
arclain_app_fs = { path = "../app_fs" }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
diesel.workspace = true
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
redb = "2.1"
aes-gcm = "0.10"
zeroize.workspace = true
base64.workspace = true
dirs.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1.0", features = ["v4"] }
tracing.workspace = true
chrono.workspace = true

# External gameta dependency (https://codeberg.org/0xdev/gameta)
gameta_core = { path = "../../../../codeberg/gameta/gameta_core", version = "=0.5.0", optional = true }

[features]
default = ["gameta"]
# The gameta metadata stack (types re-exported from `library::metadata`).
# Off: arclain_db is pure arclain persistence — no gameta code compiled.
gameta = ["dep:gameta_core"]

[dev-dependencies]
tempfile.workspace = true
rand.workspace = true

[package]
name = "arclain_ui"
version = "0.1.0"
edition = "2021"

[dependencies]
arclain_core = { path = "../core" }
arclain_plugins = { path = "../plugins" }
eframe = "0.33.0"
egui = "0.33.0"
egui_extras = { version = "0.33.0", features = ["all_loaders"] }
rfd = "0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
anyhow = "1.0.100"
regex = "1.12.2"
dirs = "6.0.0"
tempfile = "3"
open = "5"
crc32fast = "1"
chrono = "0.4"
egui-phosphor = "0.11.0"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55.0"
windows-sys = { version = "0.61.2", features = [
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_System_Threading",
	"Win32_Foundation",
] }

[dev-dependencies]
tracing-test = "0.2"

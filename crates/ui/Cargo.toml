[package]
name = "archust_ui"
version = "0.1.0"
edition = "2021"

[dependencies]
archust_core = { path = "../core" }
eframe = "0.29"
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
rfd = "0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
anyhow = "1.0.100"
regex = "1.12.2"
dirs = "6.0.0"
tempfile = "3"
open = "5"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55.0"

[package]
name = "arclain_ui"
version = "0.11.15"
edition = "2021"

[dependencies]
arclain_core = { path = "../core" }
arclain_data = { path = "../data" }
arclain_plugins = { path = "../plugins" }
eframe = "0.33.0"
egui = "0.33.0"
egui_extras = { version = "0.33.0", features = ["all_loaders"] }
rfd = "0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tracing = "0.1"
anyhow = "1.0.100"
regex = "1.12.2"
tempfile = "3"
open = "5"
crc32fast = "1"
chrono = "0.4"
egui-phosphor = "0.11.0"
arclain_db = { path = "../db" }
arclain_widgets = { path = "../widgets" }
arclain_theme = { path = "../theme" }
image = "0.25.9"
arclain-network = { path = "../network" }
arclain_signals = { path = "../signals", features = ["egui"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "sync", "time"] }

raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55.0"
windows-sys = { version = "0.61.2", features = [
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_System_Threading",
	"Win32_Foundation",
] }
windows = { version = "0.56", features = [
	"implement",
	"Win32_System_Ole",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_Foundation",
	"Win32_System_SystemServices",
	"Win32_UI_Shell",
	"Win32_UI_Shell_Common",
	"Win32_System_Memory",
	"Win32_Graphics_Gdi",
	"Win32_System_DataExchange",
	"Win32_Storage_FileSystem",
	"Win32_UI_WindowsAndMessaging",
	"Win32_System_Threading",
	"Win32_UI_Input_KeyboardAndMouse",
] }
windows-core = "0.56"

[dev-dependencies]
egui_kittest = "0.33.3"
tracing-test = "0.2"

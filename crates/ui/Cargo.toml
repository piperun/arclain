[package]
name = "arclain_ui"
version.workspace = true
edition.workspace = true

[dependencies]
# The sanctioned frontend dependency: owns the Tokio runtime and every
# composed headless service. See scripts/frontend_boundary.py's `app`
# exemption -- this is the one headless dependency the boundary guard
# accepts from a GUI crate.
arclain_app = { path = "../app" }
arclain_core = { path = "../core" }
eframe = "0.33.0"
egui = "0.33.0"
egui_extras = { version = "0.33.0", features = ["all_loaders"] }
rfd = "0.15.4"
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
tracing.workspace = true
anyhow.workspace = true
regex.workspace = true
tempfile.workspace = true
open = "5"
crc32fast = "1"
chrono.workspace = true
arboard = "3"
egui-phosphor = "0.11.0"
arclain_widgets = { path = "../widgets" }
arclain_theme = { path = "../theme" }
image = "0.25.9"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

# Rasterize the bundled SVG app icon at startup. Already a transitive
# dep via egui_extras' all_loaders feature, exposed here as a direct
# dep so we can call into it from main.rs without going through the
# image-loader registry. ~30ms one-time render on launch.
resvg = "0.45"

raw-window-handle = "0.6"

# Unix user/group name resolution for the archive-error dialog —
# translates uid 65534 → "nfsnobody" so EACCES diagnoses are legible
# instead of numeric. Already a transitive dep; pulling it in directly
# so we can call `getpwuid_r` / `getgrgid_r` without unsafe shenanigans.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55.0"
windows-sys = { version = "0.61.2", features = [
	"Win32_System_Diagnostics_ToolHelp",
	"Win32_System_Threading",
	"Win32_Foundation",
] }
windows = { version = "0.56", features = [
	"implement",
	"Win32_System_Ole",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_Foundation",
	"Win32_System_SystemServices",
	"Win32_UI_Shell",
	"Win32_UI_Shell_Common",
	"Win32_System_Memory",
	"Win32_Graphics_Gdi",
	"Win32_System_DataExchange",
	"Win32_Storage_FileSystem",
	"Win32_UI_WindowsAndMessaging",
	"Win32_System_Threading",
	"Win32_UI_Input_KeyboardAndMouse",
] }
windows-core = "0.56"

[dev-dependencies]
egui_kittest = "0.33.3"
tracing-test = "0.2"
# In-memory DieselPool construction for dispatcher tests.
arclain_db = { path = "../db" }
# Builds real ZIP fixtures in temp dirs for both the archive-mutation UI
# integration test (`tests/archive_mutation_ui_test.rs`) and the open-
# file-from-archive smoke test (`tests/open_file_from_archive_smoke_test.rs`)
# -- the same crate/version `arclain_app`'s own equivalent test fixture
# helper (`crates/app/tests/archive_sessions.rs::build_zip_fixture`)
# already uses, so this adds no new crate to the dependency tree.
zip = "7.0.0"

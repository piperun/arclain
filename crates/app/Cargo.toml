[package]
name = "arclain_app"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
crc32fast = "1"
dirs.workspace = true
parking_lot.workspace = true
# Validates a password-rule pattern actually compiles (the same engine
# `arclain_core::utilities::PassRule::to_regex` uses) before it is
# accepted -- see `settings::validate_password_rule_input`.
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
tracing.workspace = true
# `settings_ops::redact_url_userinfo` strips credentials out of a
# user-typed server URL before it reaches an error summary. Hand-rolled
# string splitting cannot do that safely -- a malformed authority hides
# userinfo in places a `split_once` pass will happily echo back -- so the
# real parser decides where the userinfo ends. Same crate/major version
# `arclain-network` (and reqwest) already depend on, so this adds nothing
# to the dependency tree.
url = "2"
zeroize.workspace = true

# Runtime composition (Task 4) pulls in the headless crates whose
# construction it now owns. All are HEADLESS_CRATES per
# scripts/frontend_boundary.py -- headless-to-headless dependencies are
# unrestricted, so this does not create a boundary violation.
arclain_app_fs = { path = "../app_fs" }
arclain_core = { path = "../core", default-features = false }
arclain_plugins = { path = "../plugins", default-features = false }
# Task 10 (settings facade) reuses `ProxyConfig::validate_for_storage` for
# `update_settings`'s SOCKS5 validation instead of re-deriving the same
# userinfo-rejection logic a second time. Headless-to-headless, so this
# adds no frontend_boundary violation (see that script's HEADLESS_CRATES).
arclain-network = { path = "../network" }
# `read_plugin_image` (Task 11) resolves a plugin-scoped cache_key
# through `arclain_data::CacheOwner`, which `arclain_core` does not
# re-export.
arclain_data = { path = "../data", default-features = false }
# Re-exported (`Signal`/`Computed`, see `lib.rs`) so `arclain_ui` can stop
# depending on `arclain_signals` directly -- headless-to-headless, so
# this adds no frontend_boundary violation. Default features only: the
# crate's own former `egui` feature is gone (see its lib.rs doc comment
# for why), so nothing about this dependency ever pulls egui in
# transitively through `arclain_app`.
arclain_signals = { path = "../signals" }

[features]
default = ["gameta"]
# The metadata stack end to end. Off: a lean archive-manager facade --
# open/list/extract/organize/pipelines all work; metadata resolution,
# the DLSite password tier and plugin metadata storage answer absent.
gameta = [
    "arclain_core/gameta",
    "arclain_plugins/gameta",
    "arclain_data/gameta",
]

[dev-dependencies]
tempfile.workspace = true
trybuild = "1.0.118"
# Captures this crate's own tracing output, from every thread, so a
# secret-redaction test can assert nothing leaked into it. Deliberately
# *not* `tracing-test`: that crate installs a thread-local scoped
# subscriber, and every facade method runs its real work on the
# application's own runtime worker threads -- so a `#[traced_test]` here
# would assert against an empty buffer and could never fail. See
# `tests/network_surface.rs::tracing_capture`.
tracing-subscriber = { version = "0.3", features = ["fmt"] }
# `crates/src/plugins.rs`'s own tests build a real `arclain_data::
# ContentCache` against an in-memory `CacheIndex`, which needs
# `arclain_db`'s `CacheEntry`/`CacheType` directly -- `arclain_data`
# does not re-export either from its own crate root. Neither is a
# metadata type, so this edge requests no default features: asking for
# them would put the whole gameta stack back into a lean build's *test*
# graph through the back door, which is exactly what `gameta = false`
# is meant to keep out. With the feature on, `arclain_core/gameta`
# turns `arclain_db/gameta` on anyway.
arclain_db = { path = "../db", default-features = false }
# Builds real ZIP fixtures in temp dirs for the archive-session tests
# (`tests/archive_sessions.rs`) -- same crate/version `arclain_core`
# already depends on, so this adds no new crate to the dependency tree.
zip = "7.0.0"

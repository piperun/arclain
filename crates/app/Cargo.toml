[package]
name = "arclain_app"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
crc32fast = "1"
dirs.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
tracing.workspace = true
zeroize.workspace = true

# Runtime composition (Task 4) pulls in the headless crates whose
# construction it now owns. All three are HEADLESS_CRATES per
# scripts/frontend_boundary.py -- headless-to-headless dependencies are
# unrestricted, so this does not create a boundary violation.
arclain_app_fs = { path = "../app_fs" }
arclain_core = { path = "../core" }
arclain_plugins = { path = "../plugins" }

[dev-dependencies]
tempfile.workspace = true
trybuild = "1.0.118"
# Builds real ZIP fixtures in temp dirs for the archive-session tests
# (`tests/archive_sessions.rs`) -- same crate/version `arclain_core`
# already depends on, so this adds no new crate to the dependency tree.
zip = "7.0.0"
# `processing_operations.rs`'s metadata-preview-equality test seeds a
# `ProductMetadata` row directly through `arclain_core::services::
# LibraryService::save_metadata` -- the same type/version `arclain_core`
# itself already depends on (see `crates/core/Cargo.toml`), just not
# re-exported from there, so this test needs its own path to construct
# one.
gameta_core = { path = "../../../../codeberg/gameta/gameta_core", version = "=0.5.0" }

[plugin]
id = "dlsite-metadata"
name = "DLSite Metadata"
version = "0.11.0"
author = "Archust Team"
description = "Extracts DLSite product codes (RJ/VJ/BJ) from archive names and enriches them with metadata from DLSite API"

[capabilities]
network = true
network_domains = ["dlsite.com", "dlsite.jp"]
archive_metadata_read = true
archive_metadata_write = true
archive_modify = true
file_read = true
file_write = true

[rate_limits]
http_requests_per_minute = 10

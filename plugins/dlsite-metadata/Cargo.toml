[package]
name = "dlsite-metadata"
version = "0.4.2"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
archust-plugin-sdk = { path = "../../plugin-sdk" }
metastore-providers = { path = "../../crates/metastore/providers" }
metastore-types = { path = "../../crates/metastore/types" }
metastore-abstract = { path = "../../crates/metastore/abstract" }
serde = { version = "1", features = ["derive", "alloc"], default-features = false }
serde_json = { version = "1", features = ["alloc"], default-features = false }
regex = "1.10"
scraper = "0.24.0"
urlencoding = "2"

# Exclude from workspace build (build manually with wasm target)
[package.metadata.workspaces]
independent = true

[profile.release]
opt-level = "z"         # Optimize for size
lto = true              # Link-time optimization
strip = true            # Strip debug symbols
panic = "abort"         # Smaller panic handler
codegen-units = 1       # Better optimization (slower compile, smaller binary)

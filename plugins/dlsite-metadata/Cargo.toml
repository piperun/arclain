[package]
name = "dlsite-metadata"
version = "0.12.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wirt-sdk = { git = "https://codeberg.org/0xdev/wirt.git", rev = "1fc2a8edcbb17830a6c6f46604453ca9126dc387", version = "0.3.0" }
# External gameta dependencies (https://codeberg.org/0xdev/gameta)
gameta_lib = { path = "../../../../codeberg/gameta/gameta_lib", version = "=0.5.0", default-features = false, features = ["dlsite"] }
gameta_core = { path = "../../../../codeberg/gameta/gameta_core", version = "=0.5.0" }
serde = { version = "1", features = ["derive", "alloc"], default-features = false }
serde_json = { version = "1", features = ["alloc"], default-features = false }
regex = "1.10"
scraper = "0.24.0"
urlencoding = "2"

# Exclude from workspace build (build manually with wasm target)
[package.metadata.workspaces]
independent = true

[workspace]

[profile.release]
opt-level = "z"         # Optimize for size
lto = true              # Link-time optimization
strip = true            # Strip debug symbols
panic = "abort"         # Smaller panic handler
codegen-units = 1       # Better optimization (slower compile, smaller binary)

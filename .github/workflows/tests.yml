name: tests

# PR validation on the GitHub side. Codeberg woodpecker owns the
# master-push test pass (cargo-test step); this workflow only fires
# on PRs to master and manual dispatch — running it on every master
# push would just duplicate woodpecker's work, since the codeberg
# push-mirror syncs every codeberg commit here within seconds.
#
# Uses cargo-nextest for parallel test execution + Swatinem/rust-cache
# so warm runs skip dep recompilation (~45s cold → ~5-10s warm).
# nextest's process-per-test isolation also catches a different
# class of test interaction bugs than cargo's threads-per-test —
# useful for verifying PRs before merge.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

# Same Node 24 opt-in as the windows workflow.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout arclain
        uses: actions/checkout@v4
        with:
          path: codeberg/arclain

      - name: Clone gameta (path-dep sibling)
        run: |
          git clone --no-checkout https://codeberg.org/0xdev/gameta.git codeberg/gameta
          git -C codeberg/gameta fetch --depth 1 origin 562c585a0f9e3814b2ce5173f3339f66cccd6d5f
          git -C codeberg/gameta checkout --detach FETCH_HEAD
          test "$(git -C codeberg/gameta rev-parse HEAD)" = "562c585a0f9e3814b2ce5173f3339f66cccd6d5f"

      - name: Install system dependencies
        # Matches `.woodpecker.yml` cargo-test step. Needed by
        # arclain_ui's egui/eframe deps and arclain-network's TLS
        # stack. pkg-config is the glue cargo's build scripts use to
        # find them. p7zip-full provides /usr/bin/7z: the CLI
        # integration tests shell out to `7z` to build a
        # header-encrypted fixture, and `sevenz_cli::runner`
        # searches PATH for 7zz/7z/7za to extract at all.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config \
            p7zip-full

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codeberg/arclain
          cache-on-failure: true

      - name: Install cargo-nextest
        # taiki-e/install-action is the fast path — downloads a
        # prebuilt binary from cargo-bins/cargo-binstall releases
        # rather than `cargo install`ing from source (~2 min saved
        # on each cold run).
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests via nextest
        working-directory: codeberg/arclain
        run: cargo nextest run --workspace --locked

      - name: Run doc-tests
        # nextest doesn't execute doctests; run them separately with
        # plain `cargo test --doc` so the suite isn't missing
        # documented-but-untested code.
        working-directory: codeberg/arclain
        run: cargo test --workspace --doc --locked

name: windows-build

# Builds the desktop binary for x86_64-pc-windows-msvc on a native
# windows-latest runner and uploads it to the matching codeberg
# release page via the forgejo API.
#
# Why this lives on GitHub at all: the woodpecker pipeline on
# codeberg can't cross-compile Windows binaries without chasing
# MSVC SDK pruning (unrar_sys's unconditional `#include <PowrProf.h>`
# is the trigger). Native windows-latest skips all of that — real
# MSVC, real link.exe, no xwin.
#
# This workflow ships in arclain's repo and rides along to the
# GitHub mirror via push/sync. The codeberg woodpecker pipeline
# still owns the Linux release; both providers upload to the same
# codeberg release page.

on:
  push:
    tags:
      # Mirror of the `.woodpecker.yml` tag matcher: app release
      # tags only. WASM plugins are bundled with the desktop app
      # until the plugin ABI has an explicit compatibility guard.
      - '[0-9]*'
  workflow_dispatch:
    # Manual fallback for re-running uploads if a previous run's
    # upload step died mid-flight.

# Opt every JavaScript-based action in this workflow into Node.js
# 24 ahead of GitHub's June 2026 hard cutover. actions/checkout@v4
# + actions/upload-artifact@v4 still default to Node 20, which is
# being removed from runners in September 2026. This env var is
# the no-version-bump path documented in the deprecation notice;
# we can drop it once we move to action @v5+ that defaults to
# Node 24 natively.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout arclain
        uses: actions/checkout@v4
        with:
          # arclain's path-deps reach gameta via
          # `../../../../codeberg/gameta/<crate>`, so we recreate
          # `<root>/codeberg/{arclain,gameta}/` exactly.
          path: codeberg/arclain

      - name: Clone gameta (path-dep sibling, from codeberg)
        # gameta isn't mirrored to GitHub, so we always fetch it
        # from its codeberg origin. Tracks master rather than a
        # pinned ref because the cargo path-dep doesn't record a
        # version — if/when arclain starts pinning a specific
        # gameta commit (e.g. via git-dep), mirror that here.
        run: git clone --depth 1 https://codeberg.org/0xdev/gameta.git codeberg/gameta

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache cargo artifacts
        # Caches ~/.cargo/registry, ~/.cargo/git, and the workspace's
        # `target/` directory keyed on Cargo.lock + Cargo.toml + rust
        # toolchain. Warm runs skip dep recompilation entirely;
        # arclain-specific code still compiles per change. ~30s → ~5s
        # on the typical PR-update build.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codeberg/arclain
          # Save the cache even if the build fails — partial cache
          # is still useful for the next attempt.
          cache-on-failure: true

      - name: Build arclain_ui (release)
        working-directory: codeberg/arclain
        run: cargo build --release --bin arclain_ui --locked

      - name: Build WASM plugins
        working-directory: codeberg/arclain
        run: python scripts/_plugins.py build

      - name: Package zip + checksum
        working-directory: codeberg/arclain
        run: python scripts/_package.py --profile release --archive

      - name: Verify bundled plugin compatibility
        working-directory: codeberg/arclain
        shell: pwsh
        run: |
          $packageDir = Get-ChildItem release -Directory -Filter "arclain-*-windows-x64" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $packageDir) {
            throw "No packaged Windows release directory found under release/"
          }

          $env:ARCLAIN_BUNDLED_PLUGIN_DIR = Join-Path $packageDir.FullName "plugins"
          cargo test --locked -p arclain_plugins --test integration_tests bundled_dlsite_plugin_loads_against_current_host -- --nocapture

      - name: Upload to codeberg release
        # Upload whenever the ref is a tag — covers both the tag push
        # AND a manual `workflow_dispatch --ref <tag>` (the advertised
        # "re-run a failed upload" fallback). A dispatch on a branch
        # (refs/heads/master) has no release to target, so it's still
        # skipped; it just builds + checksums and keeps the zip as a
        # workflow artifact (next step). Was gated on
        # `event_name == 'push'`, which silently no-op'd the manual
        # fallback the workflow_dispatch trigger promises.
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: codeberg/arclain
        shell: pwsh
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "0xdev/Arclain"
          $headers = @{ Authorization = "token $env:CODEBERG_TOKEN" }

          # Poll for the codeberg release to exist — Woodpecker's
          # publish-release step creates it on the same tag, in
          # parallel with this workflow.
          #
          # Budget sizing: Woodpecker's release path is fetch-gameta
          # → cargo-check → cargo-test → wasm-plugins →
          # build-linux-x86_64 → publish-release. On a busy shared
          # codeberg runner that's commonly 15-20 min wall-clock.
          # GitHub's own Windows build + cache restore eats the
          # first ~5-10 min before we even hit this poll, so the
          # effective polling window has to span the *gap* between
          # the two pipelines. Was 60 × 10s = 10 min and timed out
          # routinely (release created at ~20 min, GitHub gave up
          # at 10). 180 × 10s = 30 min covers the typical case with
          # margin; pushing further hits GitHub's 6-hour job limit
          # which we don't want to chew through on a polling loop.
          $maxRetries = 180
          $release = $null
          for ($i = 0; $i -lt $maxRetries; $i++) {
            try {
              $release = Invoke-RestMethod -Uri "https://codeberg.org/api/v1/repos/$repo/releases/tags/$tag" -Headers $headers
              Write-Host "Found release id=$($release.id) for tag $tag after $i retry(ies)"
              break
            } catch {
              Write-Host "Release $tag not yet on codeberg, retrying in 10s ($i/$maxRetries)…"
              Start-Sleep -Seconds 10
            }
          }
          if (-not $release) {
            $minutes = [int]($maxRetries * 10 / 60)
            throw "Codeberg release for tag $tag never appeared after $minutes min. Either the Woodpecker publish-release step failed, or it ran longer than the polling budget — check https://codeberg.org/$repo/releases first; if the release IS there, increase \$maxRetries above."
          }

          $assetsUrl = "https://codeberg.org/api/v1/repos/$repo/releases/$($release.id)/assets"
          foreach ($f in @("arclain-$tag-windows-x64.zip", "arclain-$tag-windows-x64.zip.sha256")) {
            $path = "release/$f"
            Write-Host "Uploading $f…"
            Invoke-RestMethod `
              -Uri "${assetsUrl}?name=$f" `
              -Method Post `
              -Headers $headers `
              -InFile $path `
              -ContentType "application/octet-stream"
          }

      - name: Upload zip as GitHub artifact (always)
        # Belt-and-suspenders: keep a copy on the workflow run even
        # if the codeberg upload step skipped (dispatch run) or
        # failed (token expired, etc).
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: arclain-windows-x64
          path: |
            codeberg/arclain/release/arclain-*-windows-x64.zip
            codeberg/arclain/release/arclain-*-windows-x64.zip.sha256
          retention-days: 30

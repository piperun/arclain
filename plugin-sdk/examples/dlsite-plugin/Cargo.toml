[package]
name = "dlsite-plugin"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
archust-plugin-sdk = { path = "../.." }
serde = { version = "1", features = ["derive"], default-features = false }
serde_json = { version = "1", default-features = false }

[profile.release]
opt-level = "z"
lto = true
strip = true
# Arclain CI — test on every push, build + release on tag.
#
# The arclain workspace's path-deps assume a sibling `gameta/` directory:
#   <workspace>/codeberg/arclain/
#   <workspace>/codeberg/gameta/
# Hence `workspace.path: codeberg/arclain` below — keeps the relative
# paths in crates/{core,db,plugins}/Cargo.toml resolvable in CI.
#
# Gameta is a public Codeberg repo, so the `fetch-gameta` step clones
# it unauthenticated (no token required). When gameta's API stabilises
# we can migrate to a normal cargo git-dep and remove this scaffolding.

workspace:
  base: /workspace
  path: codeberg/arclain

when:
  - event: push
    evaluate: 'not (CI_COMMIT_MESSAGE matches "^docs:")'
  - event: tag
    # Match the cog-7 unified workspace tag (e.g. 2.1.0) AND the per-
    # package plugin tag (e.g. dlsite-metadata-0.12.0).
    evaluate: 'CI_COMMIT_TAG matches "^(dlsite-metadata-)?[0-9]"'

steps:

  # ── Bootstrap: pull gameta into the sibling slot path-deps expect ───

  fetch-gameta:
    image: alpine/git
    when:
      - event: [push, tag]
    commands:
      - cd ..
      - git clone --depth 1 https://codeberg.org/0xdev/gameta.git gameta
      - ls -la gameta

  # ── Tests on every push + tag ───────────────────────────────────────

  cargo-check:
    image: rust:1.94
    when:
      - event: [push, tag]
    commands:
      - apt-get update -qq
      - apt-get install -yqq
          libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev
          libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config
      # Run as non-root so target/ ownership matches cargo-test (also
      # non-root). Without this they race on /workspace/.../target/.cargo-lock
      # — cargo-check writes as root, cargo-test reads as runner, EACCES.
      - useradd -m runner
      - chown -R runner:runner /workspace
      - su runner -c "cd /workspace/codeberg/arclain && cargo check --workspace --locked"
    depends_on: [fetch-gameta]

  cargo-test:
    image: rust:1.94
    when:
      - event: [push, tag]
    commands:
      - apt-get update -qq
      - apt-get install -yqq
          libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev
          libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config
      # Drop to a non-root user before running tests. Several tests
      # verify user-level permission denial (chmod 0o500 / 0o555 + assert
      # the operation errors); root bypasses those bits, so the tests
      # fail in CI despite passing on any real dev box. `useradd -m`
      # creates /home/runner so cargo has somewhere to write its dep
      # cache.
      #
      # --lib only: skips integration tests that exercise the egui
      # event loop (which would need xvfb in CI). Matches the user's
      # local cargo-test workflow.
      - useradd -m runner
      - chown -R runner:runner /workspace
      - su runner -c "cd /workspace/codeberg/arclain && cargo test --workspace --lib --locked"
    depends_on: [fetch-gameta]

  wasm-plugins:
    image: rust:1.94
    when:
      - event: [push, tag]
    commands:
      # `rustup target add` modifies the toolchain at /usr/local/rustup/
      # which is owned by root in the rust:1.94 image — runner can't
      # touch it, so this has to happen as root before the drop.
      - rustup target add wasm32-wasip2
      # Same non-root rationale as cargo-check / cargo-test: keeps
      # target-dir ownership consistent across parallel steps that
      # share /workspace.
      - useradd -m runner
      - chown -R runner:runner /workspace
      # plugins/dlsite-metadata is `exclude`d from the workspace
      # (see root Cargo.toml) — it builds in its own cargo context
      # because the WASM target wants different profile/codegen flags
      # than the desktop binary. So `-p dlsite-metadata` from the
      # workspace root fails with "did not match any packages"; cd
      # into the plugin dir instead.
      - su runner -c "cd /workspace/codeberg/arclain/plugins/dlsite-metadata && cargo build --release --target wasm32-wasip2"
    depends_on: [fetch-gameta]

  # ── Linux release build on tag ──────────────────────────────────────

  build-linux-x86_64:
    image: rust:1.94
    when:
      - event: tag
    commands:
      - apt-get update -qq
      - apt-get install -yqq
          libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev
          libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config
          python3
      - rustup target add wasm32-wasip2
      # --skip-tests: the cargo-test step (this step's depends_on)
      # already ran the full suite as the `runner` user. release.py
      # would re-run it here as root and trip user-permission tests
      # that explicitly check chmod 0o500/0o700 — root bypasses
      # those bits, the asserts fail. cargo-test is the source of
      # truth for test gating; release.py just builds + packages.
      - python3 scripts/release.py release --skip-tests
      - mkdir -p dist
      # The release script writes to ./release/. Bundle that whole
      # directory as the platform tarball.
      - tar -czf dist/arclain-${CI_COMMIT_TAG}-linux-x64.tar.gz
          -C release .
      # Per-platform sidecar checksum. Avoids a shared
      # `checksums-sha256.txt` that the parallel windows build would
      # have to depends_on for ordering — that depends_on can't be
      # honored on push events where build-linux doesn't run, and
      # woodpecker rejects the whole pipeline graph.
      - cd dist && sha256sum arclain-${CI_COMMIT_TAG}-linux-x64.tar.gz > arclain-${CI_COMMIT_TAG}-linux-x64.tar.gz.sha256
      - cat dist/arclain-${CI_COMMIT_TAG}-linux-x64.tar.gz.sha256
    depends_on: [cargo-check, cargo-test, wasm-plugins]

  # ── Windows release build (DISABLED — see GitHub Actions mirror) ────
  #
  # cargo-xwin cross-compile dies on unrar_sys's unconditional
  # `#include <PowrProf.h>` — xwin's default SDK pack prunes that
  # header to keep the download minimal, and `--xwin-include-debug-libs`
  # didn't bring it back. Rather than chase MSVC SDK pack manifests
  # forever, Windows builds moved to a GitHub Actions mirror with a
  # native `windows-latest` runner (real MSVC toolchain, no SDK
  # gymnastics).
  #
  # Step kept here for reference / future re-attempt with a different
  # approach (e.g. unrar Unix-only + UnrarCli fallback on Windows, or
  # swapping `unrar` for a pure-Rust RAR crate). `event: manual`
  # means it only runs if explicitly triggered from the Woodpecker
  # UI — no automatic firing.

  build-windows-x86_64:
    image: rust:1.94
    when:
      - event: manual
    commands:
      # llvm/clang/lld are the cross-compile toolchain cargo-xwin
      # invokes when targeting *-pc-windows-msvc from Linux.
      - apt-get update -qq
      - apt-get install -yqq llvm clang lld
      - useradd -m runner
      # Chown CARGO_HOME + RUSTUP_HOME too, on top of /workspace.
      # The rust:1.94 image sets both to /usr/local/{cargo,rustup}
      # and those are root-owned by default. If we ran `cargo install`
      # or `rustup target add` as root then dropped to runner, the
      # root-owned registry cache entries would block runner from
      # updating the registry → "failed to write cache: Permission
      # denied" when runner's later `cargo xwin build` tries to
      # download crates. Other cargo steps (cargo-check, cargo-test,
      # wasm-plugins) avoid this by never calling `cargo install`
      # under root — they only READ the registry, which works for
      # runner even when the dir is root-owned 0o755.
      - chown -R runner:runner /workspace /usr/local/cargo /usr/local/rustup
      - su runner -c "cargo install cargo-xwin --locked"
      - su runner -c "rustup target add x86_64-pc-windows-msvc"
      # First run downloads ~1.5GB of MSVC SDK headers/libs into
      # ~/.cache/cargo-xwin. Cached for the rest of this container's
      # lifetime; subsequent CI runs in fresh containers will re-download.
      # If/when this becomes a pain point, mount a persistent volume for
      # the cache.
      #
      # --bin arclain_ui builds only the desktop binary, skipping the
      # other workspace crates' libs that don't ship in the .exe.
      #
      # --xwin-include-debug-libs widens the SDK pack xwin downloads,
      # which (per several threads on the xwin repo) brings in extra
      # headers that the default minimal pack prunes — specifically
      # `PowrProf.h`, which unrar_sys's C++ source unconditionally
      # `#include`s. Without it the unrar_sys build aborts on every
      # source file with "fatal error: 'PowrProf.h' file not found".
      - su runner -c "cd /workspace/codeberg/arclain && cargo xwin build --release --target x86_64-pc-windows-msvc --bin arclain_ui --locked --xwin-include-debug-libs"
      - mkdir -p dist
      - cp target/x86_64-pc-windows-msvc/release/arclain_ui.exe dist/arclain-${CI_COMMIT_TAG}-windows-x64.exe
      # Per-platform sidecar checksum (see build-linux comment). No
      # depends_on the linux step — that step is tag-only and would
      # fail graph validation on push events.
      - cd dist && sha256sum arclain-${CI_COMMIT_TAG}-windows-x64.exe > arclain-${CI_COMMIT_TAG}-windows-x64.exe.sha256
      - cat dist/arclain-${CI_COMMIT_TAG}-windows-x64.exe.sha256
    depends_on: [cargo-check, cargo-test]

  publish-release:
    image: woodpeckerci/plugin-release
    when:
      - event: tag
    settings:
      base_url: https://codeberg.org
      api_key:
        from_secret: codeberg_token
      target: ${CI_COMMIT_SHA}
      files:
        - dist/arclain-*-linux-x64.tar.gz
        - dist/arclain-*-linux-x64.tar.gz.sha256
      title: ${CI_COMMIT_TAG}
    # Drop build-windows-x86_64 from depends_on: it's `event: manual`
    # now, so requiring it here would block publish-release on a step
    # that won't fire on a tag event. Windows binaries reach the
    # codeberg release via a GitHub Actions mirror that uploads to
    # this same release page via the codeberg API.
    depends_on: [build-linux-x86_64]
